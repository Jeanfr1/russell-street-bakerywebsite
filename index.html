<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--@head-->
  <script>
    // The page renders complete without JavaScript (static hero). The scroll
    // scene only switches on here, before first paint, so nothing jumps.
    (function (d) {
      var c = d.documentElement.classList, reduce = false;
      c.add('js');
      try { reduce = localStorage.getItem('russell-motion') === 'reduced'; } catch (e) {}
      if (reduce || matchMedia('(prefers-reduced-motion: reduce)').matches) c.add('reduced');
    })(document);
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
<!--@app-->
</body>
</html>
